[package]
name = "favjit-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

# Here rather than in `[dependencies]` because nothing in this crate ships: what a
# harness depends on is a test's business, and `cargo tree -p favjit-e2e -e normal`
# staying empty is the check that says so (ADR-0005).
[dev-dependencies]
# Every feature this crate's own tests name, rather than the ones unification
# would supply through the simulator: what a test can reach should not depend on
# which features another member happens to ask for.
favjit-engine = { workspace = true, features = ["sink", "source", "watchdog"] }
favjit-discovery = { workspace = true }
favjit-host-sim = { workspace = true }
# What a `SinkHost::send_report` call actually wrote is bytes on a page
# (ADR-0006): reading them back as a report or a key's usage is `favjit-hid`'s,
# not `engine`'s, since naming what crossed the boundary is the whole point of
# asserting on it here rather than on `engine`'s own decision about it.
favjit-hid = { workspace = true }
# `OutputReport`, the page a report came back on — plain data `SinkHost` itself
# is written against, not an `engine` decision.
favjit-host = { workspace = true }
# `host_boundary.rs` reads both hosts' source rather than running them, because a
# decision inside a host is one nothing can drive (ADR-0006). Parsed rather than
# grepped: what the rules are about is which function a thing is in, and a regex
# cannot say that. `full` for statements and expressions, `visit` for the walk.
syn = { version = "2", default-features = false, features = [
    "parsing",
    "full",
    "visit",
    "clone-impls",
    "printing",
] }
