[package]
name = "favjit-bin-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The same name as the macOS binary, which is ADR-0005's naming: the crates are
# per platform so that each links only its own host, and the thing a person runs
# is called `favjit` on both machines.
[[bin]]
name = "favjit"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.11"
favjit-core = { workspace = true, features = ["source"] }
favjit-host-windows = { workspace = true }
log = "0.4.34"
