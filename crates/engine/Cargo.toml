[package]
name = "favjit-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Roles, per ADR-0005, and the supervisor beside them. `watchdog` is not a role:
# it supervises both and is what `bin-watchdog` links instead of a host, so what
# the component that must not fail contains is bounded by this gate (ADR-0008).
default = []
source = []
sink = []
watchdog = []

[dependencies]
# The boundary this crate's loops are written against (ADR-0005). It holds the
# traits and their types and no code, so nothing here can be reached through it in
# the other direction: what a host crate compiles against is this same crate, and
# an operation it could borrow from would have to be defined in it.
favjit-host = { workspace = true }
# mDNS's wire format, separate from the host calls that carry its datagrams so
# `engine` can order those calls and decide which answer completes a search.
favjit-discovery = { workspace = true }
# The HID vocabulary — a key, a page, a usage, a report's bytes — held in its own
# crate for the same reason as the three below: `host-sim` has to run this table
# for real, not borrow it through the whole of this crate (ADR-0005).
favjit-hid = { workspace = true }
# The Noise construction the link's records travel in and the identity it is keyed
# on, kept out of this crate because `host-sim` has to run the same construction to
# stand in for the machine on the other end of it (ADR-0005, ADR-0012).
favjit-noise = { workspace = true }
# The link's wire format, over `favjit-hid` and `favjit-noise`'s vocabulary, for
# the same reason those two are their own crates.
favjit-link-wire = { workspace = true }
# The code exchange's own arithmetic, kept out of this crate because the suite's
# simulated peer has to run the same functions and this crate cannot depend on its
# own test double (see that crate's own doc comment).
favjit-pairing-exchange = { workspace = true }
