# resolver = "2" rather than inheriting edition 2024's resolver 3: ADR-0005's
# feature-unification findings — the ones the `[dev-dependencies]` placement in
# `e2e` rests on — were established under resolver 2, and nothing has been
# established under 3.
[workspace]
resolver = "2"
members = [
    "crates/host",
    "crates/hid",
    "crates/noise",
    "crates/link-wire",
    "crates/tray-wire",
    "crates/engine",
    "crates/pairing-exchange",
    "crates/discovery",
    "crates/host-sim",
    "crates/host-macos",
    "crates/host-windows",
    "crates/bin-macos",
    "crates/bin-windows",
    "crates/bin-menu",
    "crates/bin-tray",
    "crates/bin-watchdog",
    "crates/e2e",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
favjit-host = { path = "crates/host" }
favjit-hid = { path = "crates/hid" }
favjit-noise = { path = "crates/noise" }
favjit-link-wire = { path = "crates/link-wire" }
favjit-tray-wire = { path = "crates/tray-wire" }
favjit-engine = { path = "crates/engine" }
favjit-pairing-exchange = { path = "crates/pairing-exchange" }
favjit-discovery = { path = "crates/discovery" }
favjit-host-sim = { path = "crates/host-sim" }
favjit-host-macos = { path = "crates/host-macos" }
favjit-host-windows = { path = "crates/host-windows" }

# Line tables and no more, because a rebuild here goes into linking rather than
# into compiling: one line changed in `engine` relinks every crate below it and
# each of the suite's test binaries, and measured on this machine that rebuild
# takes 54.7s with full debuginfo against 30.9s with this — nearly all of the
# difference kernel time, copying debug sections into forty-odd binaries.
#
# Full debuginfo would buy inspecting variables under a debugger, which is not how
# anything here is read: a failure is a failing case or a trace, and what those
# need is the file and line on every backtrace frame, which this keeps.
[profile.dev]
debug = "line-tables-only"
